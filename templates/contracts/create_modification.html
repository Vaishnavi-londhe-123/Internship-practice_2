<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Request Modification - {{ contract.contract_name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2>Request Modification for: {{ contract.contract_name }}</h2>
        <a href="{% url 'dashboard' %}" class="btn btn-secondary mb-3">Back</a>

        <div class="card shadow-sm">
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Select Clause (Optional if modifying entire contract)</label>
                        <select name="clause_id" class="form-control">
                            <option value="">-- Entire Contract --</option>
                            {% for clause in clauses %}
                                <option value="{{ clause.id }}">{{ clause.order_number }}. {{ clause.title }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Original Value / Text</label>
                        <textarea name="original_value" class="form-control" rows="3" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Proposed Modification</label>
                        <textarea name="proposed_modification" class="form-control" rows="3" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Reason for Modification</label>
                        <textarea name="reason" class="form-control" rows="2" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-success">Submit Request</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
