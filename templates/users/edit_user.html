{% extends 'base.html' %}

{% block title %}Edit User - LCMS Portal{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4">
                    <h3 class="fw-bold mb-3"><i class="fa-solid fa-user-pen text-warning me-2"></i>Edit User</h3>
                    
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold">First Name</label>
                            <input type="text" name="first_name" value="{{ edit_user.first_name }}" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Last Name</label>
                            <input type="text" name="last_name" value="{{ edit_user.last_name }}" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Username</label>
                            <input type="text" name="username" value="{{ edit_user.username }}" class="form-control" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Email</label>
                            <input type="email" name="email" value="{{ edit_user.email }}" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Assign Role</label>
                            <select name="role" class="form-select">
                                <option value="">-- Select Role --</option>
                                {% for g in groups %}
                                <option value="{{ g.id }}" {% if edit_user.groups.first.id == g.id %}selected{% endif %}>{{ g.name }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-4 form-check">
                            <input type="checkbox" name="is_active" class="form-check-input" id="isActiveCheck" {% if edit_user.is_active %}checked{% endif %}>
                            <label class="form-check-label fw-semibold" for="isActiveCheck">Is Active</label>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="{% url 'user_list' %}" class="btn btn-secondary rounded-pill px-4">Cancel</a>
                            <button type="submit" class="btn btn-danger rounded-pill px-4">Update User</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
